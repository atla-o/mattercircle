# Push to main deploys Cloud Run service mattercircle-web.
# Public host: https://mattercircle.devoutshaman.com
# Org policy blocks allUsers — never pass --allow-unauthenticated.
# Public access uses invoker IAM disabled (--no-invoker-iam-check).
#
# Same Workload Identity pool as the other Devo repos.
name: Deploy mattercircle-web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-mattercircle-web
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: devo-holding
  REGION: us-west1
  SERVICE: mattercircle-web
  DOMAIN: mattercircle.devoutshaman.com
  WIF_PROVIDER: projects/384302503084/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SA: github-cloud-run-deploy@devo-holding.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --source . \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --no-invoker-iam-check \
            --quiet

      - name: Map mattercircle.devoutshaman.com
        continue-on-error: true
        run: |
          gcloud components install beta --quiet
          if ! gcloud beta run domain-mappings describe \
            --domain="${DOMAIN}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud beta run domain-mappings create \
              --service="${SERVICE}" \
              --domain="${DOMAIN}" \
              --region="${REGION}" \
              --project="${PROJECT_ID}" \
              --quiet
          fi
          gcloud beta run domain-mappings describe \
            --domain="${DOMAIN}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format="yaml(status.resourceRecords)"
